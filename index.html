<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wifi-Setup</title>
   
    <!-- PWA and Icons -->
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" type="image/png" href="icon.png">
    <meta name="theme-color" content="#020617">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">

    <style>
        :root {
            --bg: #020617;
            --blue: #007bff;
            --btn-grad: linear-gradient(135deg, #007bff 0%, #00d4ff 100%);
            --orange: #ffc100;
            --green: #32cd32;
        }
        body {
            background-color: var(--bg);
            color: #e2e8f0;
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        .header {
            background: rgba(15, 23, 42, 0.95);
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(0, 123, 255, 0.3);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .install-btn {
            background: var(--btn-grad);
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(0, 123, 255, 0.4);
            display: none; /* Controlled by JS */
            align-items: center;
            gap: 5px;
        }
        .container {
            padding: 20px;
            max-width: 500px;
            margin: auto;
        }
        .card {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(0, 123, 255, 0.2);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <div class="header">
        <div>
            <h2 style="margin:0; font-size: 16px; color: #fff;">Wifi-Setup</h2>
            <p style="margin:2px 0 0 0; font-size: 10px; color: #38bdf8;">Gateway: 192.168.100.1</p>
        </div>
        <!-- Native Install Button -->
        <button id="installAppBtn" class="install-btn">
            <span>📥 Install App</span>
        </button>
    </div>

    <div class="container">
        <div class="card">
            <h3 style="margin-top:0; font-size: 14px; color: #38bdf8;">🛡️ Security & PWA Status</h3>
            <p style="font-size: 12px; color: #94a3b8; margin-bottom: 0;">Service Worker and App Manifest are active. Click the install button above to install this tool directly as a native application on your device.</p>
        </div>
    </div>

    <script>
        // Register Service Worker correctly
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('SW Registered:', reg.scope))
                    .catch(err => console.log('SW Failed:', err));
            });
        }

        let deferredPrompt = null;
        const installBtn = document.getElementById('installAppBtn');

        window.addEventListener('beforeinstallprompt', (e) => {
            // Prevent Chrome 76+ from automatically showing the prompt
            e.preventDefault();
            deferredPrompt = e;
            // Show our custom install button
            installBtn.style.display = 'flex';
        });

        installBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    console.log('User accepted the install prompt');
                } else {
                    console.log('User dismissed the install prompt');
                }
                deferredPrompt = null;
                installBtn.style.display = 'none';
            }
        });

        window.addEventListener('appinstalled', (evt) => {
            console.log('App successfully installed');
            installBtn.style.display = 'none';
        });
    </script>
</body>
</html>
